# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # The release job's tools, which .release/package-lock.json pins
  # with every package they pull in.
  # Outside .github/, where Dependabot may change nothing but workflows.
  - package-ecosystem: npm
    directory: "/.release"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(release)"
    groups:
      release-tools:
        patterns:
          - "*"
