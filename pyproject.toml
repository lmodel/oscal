[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "oscal"
description = "OSCAL: Open Security Controls Assessment Language: LinkML Schema"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23.0",
    "linkml>=1.9.3",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/oscal/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/oscal/datamodel/oscal_pydantic.py",
  "src/oscal/datamodel/oscal.py",
  # OSCAL's metaschema, the third-party fixtures and the neighbours' adapt
  # copies, copied as published, and files copied in by the KTL sidecar sync
  # or written by npm, not by hand.
  "src/oscal/schema/metaschema/*",
  "tests/data/cncf-ai-benchmarks/*",
  "tests/data/invalid/cncf-ai-benchmarks/*",
  "tests/data/luigi_carpio/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/oscal/datamodel/oscal_pydantic.py",
  "src/oscal/datamodel/oscal.py",
  # OSCAL's metaschema, the third-party fixtures and the neighbours' adapt
  # copies, copied as published, and files copied in by the KTL sidecar sync
  # or written by npm, not by hand.
  "src/oscal/schema/metaschema/*",
  "tests/data/cncf-ai-benchmarks/*",
  "tests/data/invalid/cncf-ai-benchmarks/*",
  "tests/data/luigi_carpio/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
